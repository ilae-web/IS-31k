{% extends "base.html" %}

{% block content %}
<h2>Мои записи</h2>
{% if entries %}
    {% for entry in entries %}
    <div class="card">
        <h3>{{ entry.title }}</h3>
        <div class="date">{{ entry.date }}</div>
        <a href="{{ url_for('detail', entry_id=entry.id) }}" class="btn">Читать</a>
        <form action="{{ url_for('delete', entry_id=entry.id) }}" method="POST" style="display:inline;">
            <button type="submit" class="btn btn-danger" onclick="return confirm('Удалить запись?')">Удалить</button>
        </form>
    </div>
    {% endfor %}
{% else %}
    <p>Пока нет записей. Создайте первую!</p>
{% endif %}
{% endblock %}
